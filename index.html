    // ==================== FUNCIONES PRINCIPALES ====================
    function saveExercises() { localStorage.setItem(STORAGE_KEYS.EXERCISES, JSON.stringify(currentExercises)); }
    function saveAuthors() { localStorage.setItem(STORAGE_KEYS.AUTHORS, JSON.stringify(currentAuthors)); }
    function saveDayRatings() { localStorage.setItem(STORAGE_KEYS.DAY_RATING, JSON.stringify(dayRatings)); }

    function updateStreak() {
        const today = new Date().toISOString().slice(0,10);
        const lastVisit = localStorage.getItem(STORAGE_KEYS.LAST_VISIT);
        let currentStreak = parseInt(localStorage.getItem(STORAGE_KEYS.STREAK)) || 0;
        if (!lastVisit) currentStreak = 1;
        else {
            const diff = Math.floor((new Date(today) - new Date(lastVisit)) / (1000*60*60*24));
            if (diff === 1) currentStreak++;
            else if (diff > 1) currentStreak = 1;
        }
        streak = currentStreak;
        localStorage.setItem(STORAGE_KEYS.STREAK, streak);
        localStorage.setItem(STORAGE_KEYS.LAST_VISIT, today);
        document.getElementById('streakCount').innerText = streak;
    }

    function loadInitialData() {
        const storedAuthors = localStorage.getItem(STORAGE_KEYS.AUTHORS);
        const storedExercises = localStorage.getItem(STORAGE_KEYS.EXERCISES);
        if (storedAuthors && storedExercises) {
            currentAuthors = JSON.parse(storedAuthors);
            currentExercises = JSON.parse(storedExercises);
        } else {
            currentAuthors = [...DEFAULT_AUTHORS];
            currentExercises = JSON.parse(JSON.stringify(DEFAULT_EXERCISES));
            saveAuthors();
            saveExercises();
        }
        const storedRatings = localStorage.getItem(STORAGE_KEYS.DAY_RATING);
        if(storedRatings) dayRatings = JSON.parse(storedRatings);
        updateStreak();
    }

    function rateExercise(exerciseId, stars) {
        const ex = currentExercises.find(e => e.id === exerciseId);
        if(!ex) return;
        ex.rating_total = (ex.rating_total || 0) + stars;
        ex.rating_count = (ex.rating_count || 0) + 1;
        saveExercises();
        renderCurrentPage();
        showToast(`⭐ Calificado con ${stars} estrellas`);
    }

    function getAvgRating(ex) {
        if(!ex.rating_count) return 0;
        return ex.rating_total / ex.rating_count;
    }

    function getAuthorName(authorId) {
        const a = currentAuthors.find(a => a.id === authorId);
        return a ? a.nombre : "Clásico";
    }

    function renderCurrentPage() {
        let filtered = [...currentExercises];
        if(currentFilter === 'cambios') filtered = filtered.filter(ex => ex.categoria === 'cambios');
        if(currentFilter === 'oportunidades') filtered = filtered.filter(ex => ex.categoria === 'oportunidades');
        
        const totalPages = Math.ceil(filtered.length / ITEMS_PER_PAGE);
        if(currentPage > totalPages) currentPage = Math.max(1, totalPages);
        const start = (currentPage-1) * ITEMS_PER_PAGE;
        const paginated = filtered.slice(start, start+ITEMS_PER_PAGE);
        
        const container = document.getElementById('exercisesList');
        if(paginated.length === 0) {
            container.innerHTML = '<div style="text-align:center; padding:2rem">✨ No hay ejercicios.</div>';
            document.getElementById('paginationControls').innerHTML = '';
            return;
        }
        
        let html = '';
        for(let ex of paginated) {
            const avg = getAvgRating(ex);
            const fullStars = Math.round(avg);
            let starsHtml = '';
            for(let i=1; i<=5; i++) starsHtml += `<span class="star ${i<=fullStars?'active':''}" data-exid="${ex.id}" data-stars="${i}">★</span>`;
            html += `
                <div class="exercise-card">
                    <div class="exercise-title"><span>📘 ${escapeHtml(ex.titulo)}</span><span>⏱️ ${ex.tiempo_estimado}</span></div>
                    <div class="exercise-author">✍️ ${escapeHtml(getAuthorName(ex.autor_id))}</div>
                    <div class="theory">📖 ${escapeHtml(ex.teoria_minima)}</div>
                    <div class="consigna">🎯 ${escapeHtml(ex.consigna)}</div>
                    <div class="stars-container">${starsHtml}</div>
                    <button class="btn-complete" data-id="${ex.id}">✅ Completar y calificar</button>
                    <div class="rating-info">⭐ ${avg.toFixed(1)} (${ex.rating_count||0} valoraciones)</div>
                </div>
            `;
        }
        container.innerHTML = html;
        
        document.querySelectorAll('.star').forEach(star => {
            star.addEventListener('click', (e) => {
                const exId = star.getAttribute('data-exid');
                const starsVal = parseInt(star.getAttribute('data-stars'));
                if(exId && starsVal) rateExercise(exId, starsVal);
            });
        });
        document.querySelectorAll('.btn-complete').forEach(btn => {
            btn.addEventListener('click', (e) => {
                showToast(`¡Completado! Califica con estrellas ⭐`);
                const card = btn.closest('.exercise-card');
                if(card) card.querySelector('.stars-container')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
            });
        });
        
        let pagHtml = '';
        for(let i=1; i<=Math.min(totalPages, 10); i++) {
            pagHtml += `<button class="page-btn ${i===currentPage?'active':''}" data-page="${i}">${i}</button>`;
        }
        if(totalPages > 10) pagHtml += `<span style="margin-left:0.5rem;">… ${totalPages}</span>`;
        document.getElementById('paginationControls').innerHTML = pagHtml;
        document.querySelectorAll('.page-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                currentPage = parseInt(btn.getAttribute('data-page'));
                renderCurrentPage();
            });
        });
    }
    
    function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }
    
    function rateCurrentDay(stars) {
        const today = new Date().toISOString().slice(0,10);
        dayRatings[today] = stars;
        saveDayRatings();
        showToast(`📅 Día calificado: ${stars}★`);
    }
    
    function replaceAllContent(newAuthors, newExercises) {
        if(newExercises.length > MAX_EXERCISES) {
            showToast(`⚠️ El JSON tiene ${newExercises.length} ejercicios. Se recortarán a ${MAX_EXERCISES}.`);
            newExercises = newExercises.slice(0, MAX_EXERCISES);
        }
        currentAuthors = newAuthors;
        currentExercises = newExercises.map(ex => ({...ex, rating_total: 0, rating_count: 0}));
        saveAuthors();
        saveExercises();
        currentPage = 1;
        renderCurrentPage();
        showToast(`📦 Importado ${currentExercises.length} ejercicios.`);
    }
    
    function importFromJsonObject(jsonObj) {
        if(!jsonObj.autores || !jsonObj.ejercicios) throw new Error("Faltan 'autores' o 'ejercicios'");
        const validatedAuthors = jsonObj.autores.map(a => ({ id: a.id, nombre: a.nombre, frase: a.frase || "" }));
        const validatedExercises = jsonObj.ejercicios.map(e => ({
            id: e.id, autor_id: e.autor_id, titulo: e.titulo, categoria: e.categoria,
            teoria_minima: e.teoria_minima, consigna: e.consigna, tiempo_estimado: e.tiempo_estimado || "5 min",
            rating_total: 0, rating_count: 0
        }));
        replaceAllContent(validatedAuthors, validatedExercises);
    }
    
    function importJsonFromFile(file) {
        const reader = new FileReader();
        reader.onload = (evt) => {
            try { importFromJsonObject(JSON.parse(evt.target.result)); }
            catch(e) { showToast("❌ JSON inválido"); }
        };
        reader.readAsText(file);
    }
    
    async function importJsonFromUrl(url) {
        try {
            const resp = await fetch(url);
            if(!resp.ok) throw new Error();
            const data = await resp.json();
            importFromJsonObject(data);
        } catch(e) { showToast("🌐 Error de red o URL"); }
    }
    
    function showToast(msg) {
        let old = document.querySelector('.modal');
        if(old) old.remove();
        const toast = document.createElement('div');
        toast.className = 'modal';
        toast.innerText = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2200);
    }
    
    function bindEvents() {
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.getAttribute('data-filter');
                currentPage = 1;
                renderCurrentPage();
            });
        });
        document.getElementById('rateDayBtn').addEventListener('click', () => {
            let s = prompt("Estrellas (1 a 5) para tu día:", "5");
            let n = parseInt(s);
            if(n>=1 && n<=5) rateCurrentDay(n);
            else showToast("Valor entre 1 y 5");
        });
        document.getElementById('checkUpdatesBtn').addEventListener('click', async () => {
            let url = prompt("URL del JSON (raw GitHub):");
            if(url && url.startsWith('http')) await importJsonFromUrl(url);
        });
        document.getElementById('importJsonBtn').addEventListener('click', () => {
            let input = document.createElement('input');
            input.type = 'file';
            input.accept = 'application/json';
            input.onchange = () => { if(input.files.length) importJsonFromFile(input.files[0]); };
            input.click();
        });
    }
    
    loadInitialData();
    bindEvents();
    renderCurrentPage();
    
    // Service Worker + Manifest
    if('serviceWorker' in navigator) {
        const swCode = `self.addEventListener('install', e => { e.waitUntil(caches.open('flex-v1').then(cache => cache.addAll(['/','/index.html']))); self.skipWaiting(); });
        self.addEventListener('fetch', e => { e.respondWith(caches.match(e.request).then(r => r || fetch(e.request))); });`;
        const blob = new Blob([swCode], {type: 'application/javascript'});
        navigator.serviceWorker.register(URL.createObjectURL(blob));
    }
    (function() {
        const manifest = {
            name: "Flex · 100 ejercicios", short_name: "Flex", start_url: "/", display: "standalone",
            theme_color: "#2c7da0", background_color: "#f4f7fb",
            icons: [{ src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%232c7da0'/%3E%3Cpath d='M35,55 Q45,40 55,55' stroke='white' stroke-width='3' fill='none'/%3E%3Cpath d='M45,55 L45,70' stroke='white' stroke-width='3'/%3E%3Cpath d='M55,55 L55,70' stroke='white' stroke-width='3'/%3E%3Ctext x='50' y='45' font-size='28' text-anchor='middle' fill='%23f7b731'%3E★%3C/text%3E%3C/svg%3E", sizes: "192x192", type: "image/svg+xml" }]
        };
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], {type: 'application/json'}));
        document.head.appendChild(link);
    })();
</script>
