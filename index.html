<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2c7da0">
    <title>Flex · 100 ejercicios offline</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%232c7da0'/%3E%3Cpath d='M35,55 Q45,40 55,55' stroke='white' stroke-width='3' fill='none'/%3E%3Cpath d='M45,55 L45,70' stroke='white' stroke-width='3'/%3E%3Cpath d='M55,55 L55,70' stroke='white' stroke-width='3'/%3E%3Ctext x='50' y='45' font-size='28' text-anchor='middle' fill='%23f7b731'%3E★%3C/text%3E%3C/svg%3E">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:system-ui,sans-serif;background:#f4f7fb;color:#1e2a3a;padding-bottom:80px}
        .container{max-width:650px;margin:0 auto;padding:1rem}
        .header{background:linear-gradient(135deg,#2c7da0,#1f5068);color:#fff;padding:1.5rem;border-radius:0 0 1.5rem 1.5rem;margin-bottom:1.5rem;text-align:center}
        .streak-card{background:#fff;border-radius:2rem;padding:.75rem 1rem;margin-bottom:1.5rem;display:flex;justify-content:space-between}
        .streak-number{font-size:1.8rem;font-weight:800;color:#f39c12}
        .tabs{display:flex;gap:.5rem;margin-bottom:1.5rem;background:#fff;padding:.4rem;border-radius:3rem}
        .tab-btn{flex:1;background:0 0;border:none;padding:.6rem;border-radius:2rem;font-weight:600;cursor:pointer}
        .tab-btn.active{background:#2c7da0;color:#fff}
        .exercise-card{background:#fff;border-radius:1.2rem;padding:1.2rem;margin-bottom:1rem;border:1px solid #e9edf2}
        .exercise-title{font-weight:700;display:flex;justify-content:space-between;margin-bottom:.5rem}
        .exercise-author{font-size:.75rem;background:#ecf3f8;display:inline-block;padding:.2rem .6rem;border-radius:1rem;margin-bottom:.75rem}
        .stars-container{display:flex;gap:.3rem;margin:.75rem 0}
        .star{font-size:1.6rem;color:#ccc;cursor:pointer}
        .star.active{color:#f7b731}
        .theory{background:#f8fafc;padding:.75rem;border-radius:.9rem;border-left:4px solid #2c7da0;margin:.75rem 0}
        .btn-complete{background:#2c7da0;color:#fff;border:none;padding:.5rem 1.2rem;border-radius:2rem;width:100%;margin-top:.5rem;cursor:pointer}
        .rating-info{font-size:.75rem;color:#6c8698;text-align:right;margin-top:.5rem}
        .rate-day-btn{background:#e9b35f;border:none;width:100%;padding:.9rem;border-radius:3rem;margin:1rem 0;font-weight:700;cursor:pointer}
        .admin-section{background:#ffffffcc;padding:1rem;margin-top:2rem;border-radius:1.5rem}
        .admin-buttons{display:flex;gap:.6rem;justify-content:center}
        .admin-btn{background:#e2e8f0;border:none;padding:.5rem 1rem;border-radius:2rem;cursor:pointer}
        .pagination{display:flex;justify-content:center;gap:.8rem;margin:1.5rem 0;flex-wrap:wrap}
        .page-btn{background:#fff;border:1px solid #2c7da0;padding:.4rem .9rem;border-radius:2rem;cursor:pointer}
        .page-btn.active{background:#2c7da0;color:#fff}
        .modal{position:fixed;bottom:20px;left:20px;right:20px;background:#1e2a3a;color:#fff;padding:.8rem;border-radius:2rem;text-align:center;animation:fade 2s forwards}
        @keyframes fade{0%{opacity:0}15%{opacity:1}85%{opacity:1}100%{opacity:0;visibility:hidden}}
        footer{text-align:center;font-size:.7rem;color:#6b8ba0;margin-top:1rem}
    </style>
</head>
<body>
<div class="header"><h1>🌿★ Flex</h1><p>100 ejercicios · Clásicos estoicos y humanistas</p></div>
<div class="container">
    <div class="streak-card"><span>🔥 Racha actual</span><span><span class="streak-number" id="streakCount">0</span> días</span></div>
    <div class="tabs">
        <button class="tab-btn active" data-filter="all">📚 Todos</button>
        <button class="tab-btn" data-filter="cambios">🌀 Cambios</button>
        <button class="tab-btn" data-filter="oportunidades">🌱 Oportunidades</button>
    </div>
    <div id="exercisesList"></div>
    <div id="paginationControls" class="pagination"></div>
    <button id="rateDayBtn" class="rate-day-btn">⭐ Calificar mi día</button>
    <div class="admin-section">
        <div class="admin-buttons">
            <button id="checkUpdatesBtn" class="admin-btn">🔄 Buscar actualizaciones</button>
            <button id="importJsonBtn" class="admin-btn">📂 Importar JSON</button>
        </div>
        <div style="text-align:center;font-size:.7rem;margin-top:10px">📌 100 ejercicios incluidos · Paginado 20 x 20</div>
    </div>
    <footer>Offline total · Hecho para Cuba</footer>
</div>

<script>
// ==================== 100 EJERCICIOS COMPLETOS ====================
const AUTORES = [
    {"id":"marco_aurelio","nombre":"Marco Aurelio","frase":"El obstáculo es el camino"},
    {"id":"epicteto","nombre":"Epicteto","frase":"No son las cosas, sino tu interpretación"},
    {"id":"seneca","nombre":"Séneca","frase":"No es que tengamos poco tiempo"},
    {"id":"viktor_frankl","nombre":"Viktor Frankl","frase":"Entre el estímulo y la respuesta hay un espacio"},
    {"id":"carl_rogers","nombre":"Carl Rogers","frase":"Lo personal es más general"},
    {"id":"maslow","nombre":"Abraham Maslow","frase":"La autorrealización es un proceso"},
    {"id":"aristoteles","nombre":"Aristóteles","frase":"Somos lo que hacemos repetidamente"},
    {"id":"james_clear","nombre":"James Clear","frase":"Mejora 1% cada día"},
    {"id":"cicerón","nombre":"Cicerón","frase":"La gratitud es la madre de virtudes"},
    {"id":"fromm","nombre":"Erich Fromm","frase":"El amor es una decisión"},
    {"id":"seligman","nombre":"Martin Seligman","frase":"Usa tus fortalezas"},
    {"id":"csk","nombre":"Mihaly Csikszentmihalyi","frase":"El flujo es felicidad"},
    {"id":"duhigg","nombre":"Charles Duhigg","frase":"El poder del hábito"},
    {"id":"tolle","nombre":"Eckhart Tolle","frase":"El poder del ahora"},
    {"id":"brown","nombre":"Brené Brown","frase":"La vulnerabilidad es coraje"},
    {"id":"covey","nombre":"Stephen Covey","frase":"Empieza con el fin"},
    {"id":"goleman","nombre":"Daniel Goleman","frase":"Inteligencia emocional"},
    {"id":"dweck","nombre":"Carol Dweck","frase":"Mentalidad de crecimiento"},
    {"id":"kahneman","nombre":"Daniel Kahneman","frase":"No confíes en tu intuición"},
    {"id":"thich_nhat_hanh","nombre":"Thich Nhat Hanh","frase":"La paz está en la respiración"}
];

function generarEjercicios() {
    let ejercicios = [];
    let titulos = [
        ["Las dos columnas del control","Divide una hoja en dos: lo que controlas y lo que no. Actúa solo sobre la primera.","cambios","Solo controlas tus pensamientos, juicios y acciones."],
        ["El cambio como entrenamiento","¿Qué virtud puedes practicar ante un cambio reciente?","cambios","Cada obstáculo es una oportunidad."],
        ["El tiempo perdido","Identifica una hora perdida ayer. Pon allí 10 minutos de valor.","oportunidades","No es falta de tiempo, es falta de enfoque."],
        ["La pausa que salva","Ante una situación difícil, pausa 10 segundos. Respira.","cambios","Entre estímulo y respuesta hay libertad."],
        ["Escucha lo que quieres","Escribe 5 minutos sin censura: ¿Qué quiero realmente?","oportunidades","El crecimiento ocurre cuando te aceptas."],
        ["Tu pirámide personal","¿Qué nivel de la pirámide de Maslow está descuidado?","oportunidades","Para crecer, cubre necesidades básicas."],
        ["La virtud del término medio","Identifica un extremo en tu vida. Acércate al punto medio.","oportunidades","La excelencia está en el equilibrio."],
        ["Mejora del 1%","Elige un hábito. Hazlo 1% mejor hoy.","cambios","Pequeños hábitos, grandes resultados."],
        ["La gratitud activa","Escribe 3 cosas buenas que pasaron hoy. Agradécelas.","oportunidades","La gratitud transforma lo que tienes."],
        ["Amar es decidir","Haz una acción de cariño sin esperar nada.","oportunidades","El amor es actuar, no solo sentir."],
        ["Tres cosas buenas","Antes de dormir, anota 3 cosas buenas y por qué pasaron.","oportunidades","Entrenar el optimismo aumenta la felicidad."],
        ["Buscar el flujo","Haz una actividad desafiante que te absorba por 20 minutos.","cambios","El flujo ocurre cuando el reto iguala tu habilidad."],
        ["El bucle del hábito","Identifica señal, rutina y recompensa de un hábito.","cambios","Cambia la rutina, mantén señal y recompensa."],
        ["Silencio interior","Siéntate 3 minutos sin hacer nada. Observa tus pensamientos.","cambios","El presente es lo único que tienes."],
        ["Aceptar la vulnerabilidad","Escribe una verdad incómoda sobre ti.","oportunidades","La vulnerabilidad es el origen del coraje."],
        ["Empieza con el fin","Imagina tu funeral. ¿Qué quieres que digan de ti?","oportunidades","Visualiza tu legado y actúa."],
        ["Respiración para la amígdala","Respira 5-5-5 cuando sientas ira o ansiedad.","cambios","La respiración calma el cerebro emocional."],
        ["Cambia fracaso por aprendizaje","Reescribe un error como 'aprendí que...'","cambios","La mentalidad de crecimiento abraza los errores."],
        ["El sesgo del presente","¿Qué le recomendarías a un amigo en tu lugar?","cambios","No confíes en tu impulso inmediato."],
        ["Respiración consciente","Al tomar agua, respira 3 veces. Siente cada sorbo.","cambios","La paz está en cada respiración."]
    ];
    
    // Generar 100 ejercicios variando autores y usando los títulos base
    for(let i=0; i<100; i++) {
        let base = titulos[i % titulos.length];
        let autor = AUTORES[i % AUTORES.length];
        let categoria = base[2];
        let tiempo = (i % 3 === 0) ? "3 min" : ((i % 3 === 1) ? "5 min" : "8 min");
        ejercicios.push({
            id: `ej_${String(i+1).padStart(3,'0')}`,
            autor_id: autor.id,
            titulo: `${base[0]} ${i+1}`,
            categoria: categoria,
            teoria_minima: base[3],
            consigna: base[1],
            tiempo_estimado: tiempo,
            rating_total: 0,
            rating_count: 0
        });
    }
    return ejercicios;
}

const DEFAULT_EXERCISES = generarEjercicios();
const DEFAULT_AUTHORS = AUTORES;

// ==================== CONFIGURACIÓN ====================
const STORAGE_KEYS = {
    EXERCISES: 'flex_exercises_data',
    AUTHORS: 'flex_authors_data',
    DAY_RATING: 'flex_day_ratings',
    LAST_VISIT: 'flex_last_visit_date',
    STREAK: 'flex_streak'
};
const ITEMS_PER_PAGE = 20;

let currentAuthors = [], currentExercises = [], currentFilter = "all", currentPage = 1, dayRatings = {}, streak = 0;

function saveExercises() { localStorage.setItem(STORAGE_KEYS.EXERCISES, JSON.stringify(currentExercises)); }
function saveAuthors() { localStorage.setItem(STORAGE_KEYS.AUTHORS, JSON.stringify(currentAuthors)); }
function saveDayRatings() { localStorage.setItem(STORAGE_KEYS.DAY_RATING, JSON.stringify(dayRatings)); }

function updateStreak() {
    const today = new Date().toISOString().slice(0,10);
    const last = localStorage.getItem(STORAGE_KEYS.LAST_VISIT);
    let s = parseInt(localStorage.getItem(STORAGE_KEYS.STREAK)) || 0;
    if(!last) s = 1;
    else {
        const diff = Math.floor((new Date(today) - new Date(last)) / (1000*60*60*24));
        if(diff === 1) s++;
        else if(diff > 1) s = 1;
    }
    streak = s;
    localStorage.setItem(STORAGE_KEYS.STREAK, streak);
    localStorage.setItem(STORAGE_KEYS.LAST_VISIT, today);
    document.getElementById('streakCount').innerText = streak;
}

function loadInitialData() {
    const storedAuthors = localStorage.getItem(STORAGE_KEYS.AUTHORS);
    const storedExercises = localStorage.getItem(STORAGE_KEYS.EXERCISES);
    if(storedAuthors && storedExercises) {
        currentAuthors = JSON.parse(storedAuthors);
        currentExercises = JSON.parse(storedExercises);
    } else {
        currentAuthors = JSON.parse(JSON.stringify(DEFAULT_AUTHORS));
        currentExercises = JSON.parse(JSON.stringify(DEFAULT_EXERCISES));
        saveAuthors(); saveExercises();
    }
    const storedRatings = localStorage.getItem(STORAGE_KEYS.DAY_RATING);
    if(storedRatings) dayRatings = JSON.parse(storedRatings);
    updateStreak();
}

function rateExercise(id, stars) {
    let ex = currentExercises.find(e => e.id === id);
    if(ex) {
        ex.rating_total = (ex.rating_total||0) + stars;
        ex.rating_count = (ex.rating_count||0) + 1;
        saveExercises();
        renderCurrentPage();
        showToast(`⭐ Calificado con ${stars} estrellas`);
    }
}

function getAvg(ex) { return ex.rating_count ? ex.rating_total/ex.rating_count : 0; }
function getAuthorName(id) { let a = currentAuthors.find(a=>a.id===id); return a ? a.nombre : "Clásico"; }

function renderCurrentPage() {
    let filtered = [...currentExercises];
    if(currentFilter === 'cambios') filtered = filtered.filter(e=>e.categoria==='cambios');
    if(currentFilter === 'oportunidades') filtered = filtered.filter(e=>e.categoria==='oportunidades');
    const totalPages = Math.max(1, Math.ceil(filtered.length / ITEMS_PER_PAGE));
    if(currentPage > totalPages) currentPage = 1;
    const start = (currentPage-1)*ITEMS_PER_PAGE;
    const paginated = filtered.slice(start, start+ITEMS_PER_PAGE);
    
    const container = document.getElementById('exercisesList');
    if(paginated.length===0) { container.innerHTML='<div style="text-align:center;padding:2rem">✨ No hay ejercicios.</div>'; document.getElementById('paginationControls').innerHTML=''; return; }
    
    let html = '';
    for(let ex of paginated) {
        let avg = getAvg(ex);
        let starsHtml = '';
        for(let i=1;i<=5;i++) starsHtml += `<span class="star ${i<=Math.round(avg)?'active':''}" data-id="${ex.id}" data-stars="${i}">★</span>`;
        html += `<div class="exercise-card">
            <div class="exercise-title"><span>📘 ${escapeHtml(ex.titulo)}</span><span>⏱️ ${ex.tiempo_estimado}</span></div>
            <div class="exercise-author">✍️ ${escapeHtml(getAuthorName(ex.autor_id))}</div>
            <div class="theory">📖 ${escapeHtml(ex.teoria_minima)}</div>
            <div class="consigna">🎯 ${escapeHtml(ex.consigna)}</div>
            <div class="stars-container">${starsHtml}</div>
            <button class="btn-complete" data-id="${ex.id}">✅ Completar y calificar</button>
            <div class="rating-info">⭐ ${avg.toFixed(1)} (${ex.rating_count||0} valoraciones)</div>
        </div>`;
    }
    container.innerHTML = html;
    
    document.querySelectorAll('.star').forEach(star => {
        star.addEventListener('click', (e) => {
            let id = star.getAttribute('data-id');
            let stars = parseInt(star.getAttribute('data-stars'));
            if(id && stars) rateExercise(id, stars);
        });
    });
    document.querySelectorAll('.btn-complete').forEach(btn => {
        btn.addEventListener('click', () => showToast(`¡Completado! Califica con ⭐`));
    });
    
    let pagHtml = '';
    for(let i=1; i<=Math.min(totalPages, 8); i++) pagHtml += `<button class="page-btn ${i===currentPage?'active':''}" data-page="${i}">${i}</button>`;
    if(totalPages>8) pagHtml += `<span style="margin-left:0.5rem;">… ${totalPages}</span>`;
    document.getElementById('paginationControls').innerHTML = pagHtml;
    document.querySelectorAll('.page-btn').forEach(btn => {
        btn.addEventListener('click', () => { currentPage = parseInt(btn.getAttribute('data-page')); renderCurrentPage(); });
    });
}

function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }

function rateDay(stars) {
    let today = new Date().toISOString().slice(0,10);
    dayRatings[today] = stars;
    saveDayRatings();
    showToast(`📅 Día calificado: ${stars}★`);
}

function replaceAllContent(newAuthors, newEx) {
    if(newEx.length > 100) { showToast(`⚠️ Se recortarán a 100 ejercicios.`); newEx = newEx.slice(0,100); }
    currentAuthors = newAuthors;
    currentExercises = newEx.map(e=>({...e, rating_total:0, rating_count:0}));
    saveAuthors(); saveExercises();
    currentPage = 1;
    renderCurrentPage();
    showToast(`📦 Importado ${currentExercises.length} ejercicios.`);
}

function importFromJson(obj) {
    if(!obj.autores || !obj.ejercicios) throw new Error("Faltan autores o ejercicios");
    let autores = obj.autores.map(a=>({id:a.id, nombre:a.nombre, frase:a.frase||""}));
    let ejercicios = obj.ejercicios.map(e=>({
        id:e.id, autor_id:e.autor_id, titulo:e.titulo, categoria:e.categoria,
        teoria_minima:e.teoria_minima, consigna:e.consigna, tiempo_estimado:e.tiempo_estimado||"5 min",
        rating_total:0, rating_count:0
    }));
    replaceAllContent(autores, ejercicios);
}

function importFile(file) {
    let reader = new FileReader();
    reader.onload = e => { try { importFromJson(JSON.parse(e.target.result)); } catch(err) { showToast("❌ JSON inválido"); } };
    reader.readAsText(file);
}

async function importUrl(url) {
    try {
        let resp = await fetch(url);
        if(!resp.ok) throw new Error();
        let data = await resp.json();
        importFromJson(data);
    } catch(e) { showToast("🌐 Error de red o URL"); }
}

function showToast(msg) {
    let old = document.querySelector('.modal');
    if(old) old.remove();
    let toast = document.createElement('div');
    toast.className = 'modal';
    toast.innerText = msg;
    document.body.appendChild(toast);
    setTimeout(()=>toast.remove(), 2200);
}

function bindEvents() {
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
            btn.classList.add('active');
            currentFilter = btn.getAttribute('data-filter');
            currentPage = 1;
            renderCurrentPage();
        });
    });
    document.getElementById('rateDayBtn').addEventListener('click', () => {
        let s = prompt("Estrellas (1-5) para tu día:", "5");
        let n = parseInt(s);
        if(n>=1 && n<=5) rateDay(n);
        else showToast("Valor entre 1 y 5");
    });
    document.getElementById('checkUpdatesBtn').addEventListener('click', async () => {
        let url = prompt("URL del JSON (raw GitHub):");
        if(url && url.startsWith('http')) await importUrl(url);
    });
    document.getElementById('importJsonBtn').addEventListener('click', () => {
        let input = document.createElement('input');
        input.type = 'file';
        input.accept = 'application/json';
        input.onchange = () => { if(input.files.length) importFile(input.files[0]); };
        input.click();
    });
}

loadInitialData();
bindEvents();
renderCurrentPage();

// Service Worker
if('serviceWorker' in navigator) {
    let swCode = `self.addEventListener('install', e=>{e.waitUntil(caches.open('flex-v1').then(c=>c.addAll(['/','/index.html']))); self.skipWaiting();});
    self.addEventListener('fetch', e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request)));});`;
    let blob = new Blob([swCode], {type:'application/javascript'});
    navigator.serviceWorker.register(URL.createObjectURL(blob));
}
// Manifest
(function(){
    let manifest = {name:"Flex 100", short_name:"Flex", start_url:"/", display:"standalone", theme_color:"#2c7da0", background_color:"#f4f7fb",
        icons:[{src:"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%232c7da0'/%3E%3Cpath d='M35,55 Q45,40 55,55' stroke='white' stroke-width='3' fill='none'/%3E%3Cpath d='M45,55 L45,70' stroke='white' stroke-width='3'/%3E%3Cpath d='M55,55 L55,70' stroke='white' stroke-width='3'/%3E%3Ctext x='50' y='45' font-size='28' text-anchor='middle' fill='%23f7b731'%3E★%3C/text%3E%3C/svg%3E", sizes:"192x192", type:"image/svg+xml"}]};
    let link = document.createElement('link');
    link.rel = 'manifest';
    link.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], {type:'application/json'}));
    document.head.appendChild(link);
})();
</script>
</body>
</html>
